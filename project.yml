# project.yml — XcodeGen definition for the iOS app target
# Generate the Xcode project with:  brew install xcodegen && xcodegen
# The macOS menu bar app continues to build via `make app` (SwiftPM).
name: MonocleRadio
options:
  bundleIdPrefix: com.monocle
  deploymentTarget:
    iOS: "17.0"
packages:
  MonocleRadioKit:
    path: .
targets:
  MonocleRadioiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MonocleRadioiOS
    dependencies:
      - package: MonocleRadioKit
        product: MonocleRadioKit
      - target: MonocleRadioWidgets
        embed: true
      - target: MonocleRadioWatch
        embed: true
    info:
      path: MonocleRadioiOS/Info.plist
      properties:
        CFBundleDisplayName: Monocle Radio
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monocle.radio.ios
        PRODUCT_NAME: Monocle Radio
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 244DZU4G6S
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  MonocleRadioWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - MonocleRadioWatch
    dependencies:
      - package: MonocleRadioKit
        product: MonocleRadioKit
      - target: MonocleRadioWatchWidgets
        embed: true
    info:
      path: MonocleRadioWatch/Info.plist
      properties:
        CFBundleDisplayName: Monocle Radio
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.monocle.radio.ios
        WKRunsIndependentlyOfCompanionApp: true
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monocle.radio.ios.watchkitapp
        PRODUCT_NAME: Monocle Radio
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 244DZU4G6S
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  MonocleRadioWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - MonocleRadioWatchWidgets
    dependencies:
      - package: MonocleRadioKit
        product: MonocleRadioKit
    info:
      path: MonocleRadioWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Monocle Radio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monocle.radio.ios.watchkitapp.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 244DZU4G6S
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  MonocleRadioWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MonocleRadioWidgets
    dependencies:
      - package: MonocleRadioKit
        product: MonocleRadioKit
    info:
      path: MonocleRadioWidgets/Info.plist
      properties:
        CFBundleDisplayName: Monocle Radio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monocle.radio.ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 244DZU4G6S
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
